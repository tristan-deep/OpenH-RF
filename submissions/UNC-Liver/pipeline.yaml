pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    - beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
    - scan_convert
parameters:
    grid_type: polar
    polar_limits:
    - -0.3
    - 0.3
    grid_size_z: 640
    grid_size_x: 128
    f_number: 2.0
    dynamic_range:
    - -60
    - 0
    fill_value: -60.0
    zlims:
    - 0.005
    - 0.07159459459459461
