# zea.Pipeline for the 3D ring-array USCT reference reconstruction.
#
# The single operation `ring_das_reflectivity_3d` is a CUSTOM zea op (fused-Triton
# round-trip DAS with transmission rejection + backscatter apodization) defined and
# registered in reconstruct_3d.py. To load this pipeline you must import that module
# first so the op is in zea's registry (and have `triton` installed):
#
#     import reconstruct_3d                      # registers `ring_das_reflectivity_3d`
#     pipeline = zea.Pipeline.from_config(zea.Config.from_path("pipeline_3d.yaml"))
#
# Acquisition geometry/timing (PURE element positions, transmit subset, dt, t0, c0)
# are read from the zea file at call time. Regenerate with:
#     python reconstruct_3d.py --save-pipeline
pipeline:
    operations:
    -   name: ring_das_reflectivity_3d
        params:
            key: raw_data
            output_key: reflectivity
