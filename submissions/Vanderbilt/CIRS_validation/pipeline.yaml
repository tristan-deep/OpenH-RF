pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    -   name: beamform
        params:
            num_patches: 400
            enable_pfield: true
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    grid_size_x: 1084
    grid_size_z: 636
    dynamic_range:
    - -80
    - 0
    zlims:
    - 0
    - 0.18
    xlims:
    - -0.08
    - 0.06
    apply_lens_correction: false
    f_number: 0
