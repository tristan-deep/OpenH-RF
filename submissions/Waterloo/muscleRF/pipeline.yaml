pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    -   name: band_pass_filter
        params:
            passband:
            - 3000000.0
            - 7000000.0
    - demodulate
    -   name: beamform
        params:
            num_patches: 1000
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
