pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    -   name: band_pass_filter
        params:
            passband:
            - 20000000.0
            - 50000000.0
    - demodulate
    -   name: low_pass_filter
        params:
            complex_channels: true
    -   name: downsample
        params:
            factor: 32
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
    # These ops run per-frame (mapped over the batch axis), so axes refer to the
    # per-frame (n_theta, n_rho, 1) array, not the batched tensor.
    -   name: keras.ops.squeeze     # (n_theta, n_rho, 1) -> (n_theta, n_rho)
        params:
            axis: -1
    -   name: keras.ops.transpose   # -> (n_rho, n_theta), the layout scan_convert wants
        params:
            axes:
            - 1
            - 0
    -   name: scan_convert          # polar -> Cartesian; coordinates passed in at run time
        params:
            order: 1
