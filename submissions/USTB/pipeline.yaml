# B-mode pipeline for non-focused linear-array acquisitions: plane-wave
# compounding (CPWC), diverging waves (DW), synthetic transmit aperture (STA)
# and plane-wave tracking (SWE/ARFI). These insonify the whole field of view,
# so pressure-field weighting is disabled (equal coherent compounding).
#
# apply_window tapers/zeros the start of each RF line to suppress the transmit
# near-field ringdown and receive sidelobes.

parameters:
  f_number: 1.75
  grid_size_x: 400
  grid_size_z: 600
  dynamic_range: [-60, 0]
  selected_transmits: all

pipeline:
  operations:
    - name: keras.ops.cast
      params:
        dtype: float32
    - name: apply_window
    - name: demodulate
    - name: beamform
      params:
        beamformer: delay_and_sum
        enable_pfield: false
        num_patches: 200
    - name: envelope_detect
    - name: normalize
    - name: log_compress
