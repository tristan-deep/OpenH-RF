# Scanline (line-by-line) B-mode for focused linear (FI) scans: each focused
# transmit forms one image line (no cross-transmit compounding).

parameters:
  f_number: 1.75
  dynamic_range: [-60, 0]
  grid_type: scanline
  selected_transmits: all
  scanline_sector: false
  num_scanline_pixels: 700

pipeline:
  operations:
    - name: keras.ops.cast
      params:
        dtype: float32
    - name: apply_window
    - name: demodulate
    - name: beamform
      params:
        beamformer: delay_and_sum
        enable_receive_apodization: true
        enable_pfield: false
        num_patches: 200
    - name: envelope_detect
    - name: normalize
    - name: log_compress
