# 3D sector-volume grid (radius x azimuth x elevation). zea's built-in
# grid_type: polar is 2D only, so the full 3D volume is specified here and built by
# reconstruct_PD_3d.py, which injects it into the beamformer via the grid/flatgrid
# overrides. The central planes match the two perpendicular sectors of reconstruct.py.
grid:
  azimuth_limits: [-0.45, 0.45]     # x-z fan half-angle [rad] (≈ ±26°)
  elevation_limits: [-0.45, 0.45]   # y-z fan half-angle [rad]
  zlims: [0.01, 0.11]               # on-axis depth range [m]
  n_radial: 200                     # samples along each ray (~depth, 0.5 mm)
  n_azimuth: 80                     # rays in the x-z plane
  n_elevation: 80                   # rays in the y-z plane

parameters:
  grid_type: polar
  grid_size_y: 1

pipeline:
  operations:
    - name: keras.ops.cast
      params:
        dtype: float32
    - name: beamform
      params:
        beamformer: delay_and_sum
    - name: envelope_detect
    - name: tissue_highpass       # custom op: slow-time high-pass (wall) filter
      params:
        cutoff_hz: 100.0
        frame_rate_hz: 4000.0
        transition_hz: 10.0
    - name: power_doppler         # custom op: sum of squared envelope over slow time
