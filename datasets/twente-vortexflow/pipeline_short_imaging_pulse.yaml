pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    - demodulate
    - beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    xlims:
    - -0.08
    - 0.08
    zlims:
    - 0.05
    - 0.1
    grid_size_x: 1536
    grid_size_z: 480
    dynamic_range:
    - -50
    - 0
